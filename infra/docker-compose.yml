# =====================================================================
# Docker Compose — Infrastructure yCogniCore Cloud
# 6 services : PostgreSQL 16, Redis 7, Vault 1.17.6, MinIO, Prometheus, Grafana
# Ref. : ADR-012, ADR-013, Sprint H3.0 (instrumentation)
# =====================================================================

services:
  # -------------------------------------------------------------------
  # PostgreSQL 16 — Control Plane + Bases tenant
  # -------------------------------------------------------------------
  pg:
    image: postgres:16
    container_name: pg-ycc
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_ycc_data:/var/lib/postgresql/data
    networks:
      - ycc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Redis 7 — Cache, sessions, rate limiting
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis-ycc
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ycc-network
    command: redis-server --appendonly yes --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Vault 1.17.6 — Coffre de secrets + transit (AES-256-GCM)
  # -------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17.6
    container_name: vault-ycc
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ycc-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - ycc-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # MinIO — Stockage objet (pgsty/minio — ADR-013)
  # -------------------------------------------------------------------
  minio:
    image: pgsty/minio:latest
    container_name: minio-ycc
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ycc-admin
      MINIO_ROOT_PASSWORD: ycc-admin-password
    volumes:
      - minio_data:/data
    networks:
      - ycc-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Prometheus — Base de métriques (Sprint H3.0)
  # -------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus-ycc
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ycc-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Grafana — Dashboards de visualisation (Sprint H3.0)
  # -------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana-ycc
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - ycc-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

# =====================================================================
# Volumes
# =====================================================================
volumes:
  pg_ycc_data:
    external: true
    name: pg_ycc_data
  redis_data:
    name: ycc_redis_data
  minio_data:
    name: ycc_minio_data
  prometheus_data:
    name: ycc_prometheus_data
  grafana_data:
    name: ycc_grafana_data

# =====================================================================
# Reseau interne
# =====================================================================
networks:
  ycc-network:
    name: ycc-network
    driver: bridge
