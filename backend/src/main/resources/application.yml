spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ycc_control_plane
    username: postgres
    password: postgres
    hikari:
      pool-name: cp-pool
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration/control-plane
    schemas: public
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

ycc:
  vault:
    url: ${VAULT_URL:http://localhost:8200}
    token: ${VAULT_TOKEN:ycc-dev-token}
    transit-key: ycc-mfa-key
    issuer: "yCogniCore Cloud"

  jwt:
    secret: "ZGvtby1zWnyXZQtxmWvbGFjZ1s1tZSlpbilwcm9kdWN0aW9uLXVzZXItc2NvcGUtZ2x5Xnl1X21lc3NhZ2Utc2lnbmVkLWtleQ=="
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 7

  multitenant:
    tenant-pool:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout-ms: 10000
      idle-timeout-ms: 300000
      max-lifetime-ms: 900000
    lookup-cache-ttl-seconds: 300

  partition:
    months-ahead: 3
    cron: "0 0 2 1 * *"
    db-host: ${PG_HOST:localhost}
    db-password: ${PG_ADMIN_PASSWORD:postgres}

logging:
  level:
    root: INFO
    bf.ycognicore: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: false
    diskspace:
      enabled: true
  metrics:
    tags:
      application: ycognicore-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms, 200ms, 500ms, 1s, 2s
  prometheus:
    metrics:
      export:
        enabled: true
