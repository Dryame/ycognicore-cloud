name: Intrusion — tests cross-tenant

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  intrusion:
    name: Tests d'intrusion (6 scenarios)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ycc_control_plane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - name: Vault (Docker)
        run: |
          docker run -d --name vault-ycc \
            -p 8200:8200 \
            -e 'VAULT_DEV_ROOT_TOKEN_ID=ycc-dev-token' \
            -e 'VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200' \
            hashicorp/vault:latest server -dev
          sleep 5
          curl -s -o /dev/null -w "Vault: %{http_code}\n" http://localhost:8200/v1/sys/health

      - name: Start backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:postgresql://localhost:5432/ycc_control_plane
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          VAULT_URL: http://localhost:8200
          VAULT_TOKEN: ycc-dev-token
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-secret-key-must-be-64-bytes-minimum-for-hs512-signing-xxxxxxxxxxxxxxxxx' }}
        run: |
          cd backend
          nohup java -jar target/*.jar > /tmp/backend.log 2>&1 &
          echo "Backend PID: $!"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health | grep -q "200"; then
              echo "✓ Backend démarré en $((i*2))s"
              break
            fi
            sleep 2
          done

      - name: Tests d'intrusion
        run: bash docs/h2/tests-intrusion/run-tests.sh

      - name: Upload logs backend (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-intrusion-logs
          path: /tmp/backend.log
          retention-days: 7
