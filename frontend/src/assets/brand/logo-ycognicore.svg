<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" role="img" aria-label="yCogniCore Cloud">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8102e"/>
      <stop offset="1" stop-color="#8a0a1e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a5a2e"/>
      <stop offset="1" stop-color="#0e3b1e"/>
    </linearGradient>
  </defs>

  <!-- Icone cerveau/nuage -->
  <g transform="translate(8, 12)">
    <!-- Forme rouge a gauche -->
    <path d="M32 32
             a16 16 0 0 1 16-16
             a14 14 0 0 1 20-8
             a18 18 0 0 1 18 18
             l0 32
             a12 12 0 0 1-12 12
             l-32 0
             a12 12 0 0 1-12-12
             l0-26 z"
          fill="url(#g1)"/>
    <!-- Forme verte a droite -->
    <path d="M50 12
             a18 18 0 0 1 22 6
             a16 16 0 0 1 18 0
             a14 14 0 0 1 14 14
             a14 14 0 0 1-8 26
             l0 8
             a12 12 0 0 1-12 12
             l-34 0
             z"
          fill="url(#g2)"/>
    <!-- Cervelet blanc (nervures) -->
    <path d="M56 28 q4-6 10-2 q6 4 10-2"
          stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9" stroke-linecap="round"/>
    <path d="M52 42 q6-6 14 0 q8 6 16-2"
          stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9" stroke-linecap="round"/>
    <circle cx="76" cy="34" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="60" cy="48" r="2" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Texte yCogni (rouge) -->
  <text x="140" y="46"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="30" font-weight="700" fill="#c8102e"
        letter-spacing="-1">yCogni</text>
  <!-- Texte Core (vert) -->
  <text x="248" y="46"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="30" font-weight="700" fill="#1a5a2e"
        letter-spacing="-1">Core</text>
  <!-- Cloud -->
  <text x="140" y="70"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="13" font-weight="500" fill="#5a6169"
        letter-spacing="5">Cloud</text>
</svg>
