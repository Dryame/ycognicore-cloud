# =====================================================================
# docker-compose.yml — Infrastructure yCogniCore Cloud
# Réf. : BL-006
# Services : PostgreSQL 16 + Redis 7 + Vault 1.15 + MinIO
# =====================================================================

name: ycc-infra

services:
  # -------------------------------------------------------------------
  # PostgreSQL — Réutilise le volume pg_ycc_data existant
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: pg-ycc
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_ycc_data:/var/lib/postgresql/data
    networks:
      - ycc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Redis 7 — Cache, sessions, rate limiting
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis-ycc
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ycc-network
    command: redis-server --appendonly yes --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # HashiCorp Vault — Mode dev (⚠️ à sécuriser en production)
  # -------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17.6
    container_name: vault-ycc
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ycc-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - ycc-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # MinIO — Stockage objet (PDF, QR Code, KYC, documents)
  # -------------------------------------------------------------------
  minio:
    image: pgsty/minio:latest
    container_name: minio-ycc
    restart: unless-stopped
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: ycc-admin
      MINIO_ROOT_PASSWORD: ycc-admin-password
    volumes:
      - minio_data:/data
    networks:
      - ycc-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

# ---------------------------------------------------------------------
# Volumes — pg_ycc_data est EXTERNE (réutilise le volume existant)
# ---------------------------------------------------------------------
volumes:
  pg_ycc_data:
    external: true
    name: pg_ycc_data
  redis_data:
    name: ycc_redis_data
  minio_data:
    name: ycc_minio_data

# ---------------------------------------------------------------------
# Réseau interne
# ---------------------------------------------------------------------
networks:
  ycc-network:
    name: ycc-network
    driver: bridge
