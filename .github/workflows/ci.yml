name: CI — yCogniCore Cloud

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ycc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile backend
        working-directory: backend
        run: ./mvnw clean compile -B

      - name: Run backend tests (bloquant)
        working-directory: backend
        run: ./mvnw test -B

      - name: Package backend
        working-directory: backend
        run: ./mvnw package -DskipTests -B

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  security:
    name: Security (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (Node 22 + Angular 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        run: npx ng build --configuration production

      - name: Install @axe-core/cli
        run: npm install -g @axe-core/cli

      - name: Run AllY audit (WCAG 2.1 AA)
        run: |
          echo "Démarrage du serveur Angular..."
          cd frontend
          npx ng serve --port 4200 --poll=2000 &
          NG_PID=$!
          sleep 30

          echo "Audit AllY..."
          axe http://localhost:4200/login --tags wcag2a,wcag2aa,wcag21a,wcag21aa --save /tmp/axe-report.json || true

          echo "Analyse du rapport..."
          if [ -f /tmp/axe-report.json ]; then
            CRITICAL=$(python3 -c "import json; d=json.load(open('/tmp/axe-report.json')); print(sum(1 for v in d.get('violations',[]) if v.get('impact')=='critical'))" 2>/dev/null || echo "0")
            echo "Violations critiques : $CRITICAL"
            if [ "$CRITICAL" -gt 0 ]; then
              echo "✗ Violations AllY critiques détectées"
              kill $NG_PID || true
              exit 1
            fi
            echo "✓ Aucune violation critique"
          fi
          kill $NG_PID || true

      - name: Upload AllY report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ally-report
          path: /tmp/axe-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/
          retention-days: 7

  quality:
    name: Qualite (structure projet)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "=== Verification de la structure ==="
          test -f backend/pom.xml && echo "OK backend/pom.xml"
          test -f frontend/package.json && echo "OK frontend/package.json"
          test -f docs/BACKLOG.md && echo "OK docs/BACKLOG.md"
          test -f docs/adr/ADR-006.md && echo "OK docs/adr/ADR-006.md"
          echo "=== Structure validee ==="

  summary:
    name: Resume
    runs-on: ubuntu-latest
    needs: [backend, frontend, quality, security]
    if: always()
    steps:
      - name: Statut global
        run: |
          echo "Backend  : ${{ needs.backend.result }}"
          echo "Frontend : ${{ needs.frontend.result }}"
          echo "Qualite  : ${{ needs.quality.result }}"
          echo "Securite : ${{ needs.security.result }}"
          if [ "${{ needs.backend.result }}" = "success" ] && \
             [ "${{ needs.frontend.result }}" = "success" ] && \
             [ "${{ needs.quality.result }}" = "success" ] && \
             [ "${{ needs.security.result }}" = "success" ]; then
            echo "Pipeline : VERT"
            exit 0
          else
            echo "Pipeline : ECHEC"
            exit 1
          fi
