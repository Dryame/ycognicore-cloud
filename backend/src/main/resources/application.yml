spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ycc_control_plane}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: cp-pool
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration/control-plane
    schemas: public
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

ycc:
  geoip:
    database-path: ${YCC_GEOIP_DB_PATH:./data/geoip/dbip-city-lite.mmdb}
  security:
    hsts-max-age: 31536000
    frame-options: DENY
    referrer-policy: strict-origin-when-cross-origin
    csp: "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    cors:
      allowed-origins: "http://localhost:4200,http://127.0.0.1:4200"
      allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      allowed-headers: "Authorization,Content-Type,X-XSRF-TOKEN,X-Tenant-Code"
      allow-credentials: true
      max-age: 3600
  csrf:
    enforce: false   # L3.7 : observation, activer apres migration frontend
  vault:
    url: ${VAULT_URL:http://localhost:8200}
    token: ${VAULT_TOKEN}
    transit-key: ycc-mfa-key
    issuer: "yCogniCore Cloud"

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 7

  multitenant:
    tenant-pool:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout-ms: 10000
      idle-timeout-ms: 300000
      max-lifetime-ms: 900000
    lookup-cache-ttl-seconds: 300

  partition:
    months-ahead: 3
    cron: "0 0 2 1 * *"
    db-host: ${PG_HOST:localhost}
    db-password: ${PG_ADMIN_PASSWORD}

  migration:
    runner: false   # activé uniquement avec --ycc.migration.runner=true

logging:
  level:
    root: INFO
    bf.ycognicore: INFO
    org.hibernate.SQL: WARN

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: false
    diskspace:
      enabled: true
  metrics:
    tags:
      application: ycognicore-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms, 200ms, 500ms, 1s, 2s
  prometheus:
    metrics:
      export:
        enabled: true
