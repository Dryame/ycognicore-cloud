<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Selection</title>
<style>
body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
h1 { color:#1565c0; }
.toolbar { background:white; padding:15px; border-radius:8px; margin-bottom:15px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.1); display:flex; gap:20px; align-items:center; }
.toolbar b { color:#1565c0; font-size:1.4em; }
.toolbar button { padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
.btn-export { background:#2e7d32; color:white; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:15px; }
.capture { background:white; border-radius:8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
.capture.assigned { outline:4px solid #2e7d32; }
.capture img { width:100%; height:220px; object-fit:cover; display:block; cursor:zoom-in; }
.capture .body { padding:12px; }
.capture select { width:100%; padding:10px; border:2px solid #ddd; border-radius:6px; font-size:0.95em; }
.capture select.assigned { background:#c8e6c9; font-weight:bold; border-color:#2e7d32; }
.capture .nom { font-size:0.75em; font-family:monospace; color:#888; margin-top:6px; }
</style>
</head>
<body>
<h1>Selection rapide (12 candidates)</h1>
<div class="toolbar">
<span>Assignees : <b id="count">0</b>/12</span>
<button class="btn-export" onclick="exporter()">Exporter</button>
<button onclick="reset()">Reset</button>
</div>
<div class="grid" id="grid"></div>
<script>
const IMAGES = ['cand_09h30_capture.png', 'cand_10h00_capture.png', 'cand_10h30_capture.png', 'cand_11h00_capture.png', 'cand_11h30_capture.png', 'cand_12h00_capture.png', 'cand_12h30_capture.png', 'cand_13h00_capture.png', 'cand_13h30_capture.png', 'cand_14h00_capture.png', 'cand_14h30_capture.png', 'cand_15h30_capture.png'];
const CIBLES = [('', '--- Ignorer ---'), ('01-docker-services.png', '1 Services Docker'), ('02-minio-buckets.png', '2 MinIO buckets'), ('03-vault-keys.png', '3 Vault keys'), ('04-redis-minio-tests.png', '4 Tests services'), ('05-postgres-bases.png', '5 Postgres bases'), ('06-flyway-history.png', '6 Flyway history'), ('07-endpoint-run.png', '7 Endpoint run'), ('08-endpoint-history.png', '8 Endpoint history'), ('09-partitions-demo001.png', '9 Partitions demo001'), ('10-13-migrations.png', '10 13 migrations'), ('11-git-log.png', '11 Git log'), ('12-git-tags.png', '12 Git tags')];
const assignments = {};
function render() {
    document.getElementById('grid').innerHTML = IMAGES.map(img => {
        const sel = assignments[img] || '';
        const opts = CIBLES.map(([v, l]) => `<option value="${v}" ${sel === v ? 'selected' : ''}>${l}</option>`).join('');
        return `<div class="capture ${sel ? 'assigned' : ''}">
            <img src="${img}" onclick="window.open(this.src)">
            <div class="body">
                <select class="${sel ? 'assigned' : ''}" onchange="assigner('${img}', this.value)">${opts}</select>
                <div class="nom">${img}</div>
            </div>
        </div>`;
    }).join('');
    document.getElementById('count').textContent = Object.values(assignments).filter(v => v).length;
}
function assigner(img, val) {
    if (val) assignments[img] = val; else delete assignments[img];
    render();
}
function reset() {
    if (!confirm('Reset ?')) return;
    for (const k in assignments) delete assignments[k];
    render();
}
function exporter() {
    const remplis = Object.entries(assignments).filter(([_, v]) => v);
    if (remplis.length === 0) { alert('Aucune assignation'); return; }
    const mapping = {};
    for (const [img, cible] of remplis) {
        if (mapping[cible]) { alert('Conflit: ' + cible); return; }
        mapping[cible] = img;
    }
    const json = JSON.stringify({mapping: mapping}, null, 2);
    const blob = new Blob([json], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mapping.json';
    a.click();
}
render();
</script>
</body>
</html>
